[project]
name = "fifa-ml"
version = "0.1.0"
description = "FIFA World Cup scoreline prediction and betting strategy simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "joblib>=1.3",
  "libsql>=0.1.11",
  "scikit-learn>=1.4",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
