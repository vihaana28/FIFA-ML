name: Production Sync

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production sync
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$PROD_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${PROD_URL%/}/admin/cron/sync"
